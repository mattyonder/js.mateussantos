name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A dependency can get a new advisory without any change on our side: audit every Monday.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. No secrets are used anywhere.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot).
      # Dependabot keeps them current and updates the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` installs exactly what package-lock.json says and fails if it is out of sync.
      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint (TypeScript and templates, including accessibility rules)
        run: npm run lint

      - name: Colour contrast of the design tokens (WCAG 2.2 AA, both themes)
        run: npm run check:contrast

      - name: Unit tests
        run: npm run test:ci

      - name: Build (SEO files, prerender, font preloads, 404.html)
        run: npm run build

      # Fails when an inline script changed (e.g. Angular upgrade) and vercel.json still has old hashes.
      - name: CSP hashes match the built pages
        run: npm run csp:check

      # Serves dist/ with the headers from vercel.json and drives real Chrome.
      - name: Smoke test in Chrome under the production security headers
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # The whole dependency tree, development dependencies included.
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
