<section [id]="sectionId()" [attr.aria-labelledby]="headingId()" [class.subtle]="subtle()">
  <div class="container">
    <header class="header" appReveal>
      @if (label(); as text) {
        <p class="eyebrow">
          @if (number(); as value) {
            <span class="num" aria-hidden="true">{{ value }}</span>
            <span class="rule" aria-hidden="true"></span>
          }
          <span class="label">{{ text }}</span>
        </p>
      }
      <h2 [id]="headingId()">{{ heading() }}</h2>
    </header>
    <div class="body">
      <ng-content />
    </div>
  </div>
</section>
